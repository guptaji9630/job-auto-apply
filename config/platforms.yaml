# Platform-specific configuration overrides
# This file can be used to override platform settings per environment

linkedin:
  selectors:
    loginForm: "form.login-form"
    jobCard: ".job-search-card"
    jobTitle: "h3.job-title"
    companyName: ".company-name"
    location: ".job-location"
    applyButton: "button.apply-button"
    easyApplyModal: ".jobs-easy-apply-modal"
    nextButton: "button[aria-label='Continue to next step']"
    submitButton: "button[aria-label='Submit application']"

naukri:
  selectors:
    loginForm: "form.login-form"
    jobCard: ".job-card"
